<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGADA Customer Portal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#222}
.wrap{max-width:460px;margin:auto;padding:20px 14px 40px}
.logo{text-align:center;color:#a90062;font-size:32px;font-weight:bold;margin-top:15px}
.sub{text-align:center;color:#555;margin:5px 0 20px;font-size:15px}
.card{background:white;border-radius:18px;padding:20px;box-shadow:0 5px 20px rgba(0,0,0,.08)}
.tabs{display:flex;gap:8px;margin-bottom:20px}
.tabs button{flex:1;padding:14px;border:1px solid #ddd;border-radius:10px;background:#f1f1f1;font-size:16px;font-weight:bold}
.tabs .active{background:#a90062;color:white;border-color:#a90062}
h2{margin-top:0;font-size:22px}
label{display:block;font-weight:bold;margin-top:15px;margin-bottom:6px}
input{width:100%;height:50px;border:1px solid #ccc;border-radius:9px;padding:0 13px;font-size:16px;outline:none}
input:focus{border-color:#a90062}
input[readonly]{background:#f1f1f1;font-weight:bold}
button.primary,button.secondary{width:100%;height:50px;margin-top:18px;border-radius:9px;font-size:16px;font-weight:bold}
.primary{border:0;background:#a90062;color:white}
.secondary{border:1px solid #a90062;background:white;color:#a90062}
.primary:disabled,.secondary:disabled{opacity:.6}
.note{font-size:13px;color:#666;line-height:1.5}
.gen-note{text-align:center;font-size:13px;color:#666;margin-top:7px}
.msg{margin-top:15px;padding:12px;border-radius:9px;display:none;line-height:1.5;font-size:14px}
.msg.error{display:block;background:#fff0f0;color:#a00000;border:1px solid #ffcaca}
.msg.success{display:block;background:#edfff1;color:#08752b;border:1px solid #b8edc6}
.hidden{display:none}
.small-link{text-align:center;margin-top:14px}
.small-link button{border:0;background:none;color:#a90062;font-weight:bold;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
<div class="logo">AGADA</div>
<div class="sub">Daily Contribution Customer Portal</div>
<div class="card">
<div class="tabs">
<button id="createTab" class="active">Create Account</button>
<button id="loginTab">Login</button>
</div>

<section id="createPanel">
<h2>Create Customer Account</h2>
<p class="note">Your 3-digit account/card number is generated automatically. Keep it safe because you will use it to login.</p>

<label>Full Name</label>
<input id="regName" type="text" placeholder="Enter your full name" autocomplete="name">

<label>Phone Number</label>
<input id="regPhone" type="tel" placeholder="Enter your phone number" autocomplete="tel">

<label>Email Address</label>
<input id="regEmail" type="email" placeholder="Enter your email address" autocomplete="email">

<label>Account / Card Number</label>
<input id="regCard" type="text" inputmode="numeric" readonly>
<div class="gen-note">🔐 Automatically generated</div>

<label>Password</label>
<input id="regPassword" type="password" placeholder="Create a password" autocomplete="new-password">

<label>Confirm Password</label>
<input id="regConfirm" type="password" placeholder="Confirm your password" autocomplete="new-password">

<button id="createBtn" class="primary">CREATE ACCOUNT</button>
</section>

<section id="loginPanel" class="hidden">
<h2>Customer Login</h2>
<p class="note">Enter your 3-digit account/card number and password.</p>

<label>Account / Card Number</label>
<input id="loginCard" type="text" inputmode="numeric" maxlength="3" placeholder="Example: 731">

<label>Password</label>
<input id="loginPassword" type="password" placeholder="Enter your password" autocomplete="current-password">

<button id="loginBtn" class="primary">LOGIN</button>

<div class="small-link"><button id="forgotBtn">Forgot Password?</button></div>
</section>

<div id="msg" class="msg"></div>
</div>
</div>

<script>
const SUPABASE_URL="https://pijuxtwktpjoiougccod.supabase.co";
const SUPABASE_KEY="sb_publishable_ZF-CV-zjE1qXg5hc2HeJhg_wXToYSm2";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);

function show(text,success=false){
const box=$("msg");
box.textContent=text;
box.className="msg "+(success?"success":"error");
}

async function generateCard(){
$("regCard").value="";
$("regCard").placeholder="Generating...";
const {data,error}=await db.rpc("generate_customer_account_number");
if(error){
console.error(error);
$("regCard").placeholder="Generation failed";
show("Could not generate your account number. Please try again.");
return false;
}
$("regCard").value=String(data);
$("regCard").placeholder="";
return true;
}

$("createTab").onclick=async function(){
$("createTab").classList.add("active");
$("loginTab").classList.remove("active");
$("createPanel").classList.remove("hidden");
$("loginPanel").classList.add("hidden");
$("msg").className="msg";
if(!$("regCard").value) await generateCard();
};

$("loginTab").onclick=function(){
$("loginTab").classList.add("active");
$("createTab").classList.remove("active");
$("loginPanel").classList.remove("hidden");
$("createPanel").classList.add("hidden");
$("msg").className="msg";
};

$("createBtn").onclick=async function(){
const name=$("regName").value.trim();
const phone=$("regPhone").value.trim();
const email=$("regEmail").value.trim();
const card=$("regCard").value.trim();
const password=$("regPassword").value;
const confirm=$("regConfirm").value;

if(!name||!phone||!email||!card||!password||!confirm){
show("Please fill in every field.");
return;
}
if(!/^\d{3}$/.test(card)){
show("Account/Card Number must be exactly 3 digits.");
await generateCard();
return;
}
if(password.length<6){
show("Password must be at least 6 characters.");
return;
}
if(password!==confirm){
show("Passwords do not match.");
return;
}

$("createBtn").disabled=true;
$("createBtn").textContent="CREATING ACCOUNT...";

try{
const {data,error}=await db.auth.signUp({
email:email,
password:password,
options:{
data:{
full_name:name,
phone_number:phone,
account_number:card
}
}
});

if(error) throw error;
if(!data.user) throw new Error("Account could not be created.");

if(!data.session){
show("Account created successfully. Your account number is "+card+". Please check your email to confirm your account.",true);
return;
}

show("Account created successfully! Your account number is "+card+".",true);

setTimeout(function(){
$("loginTab").click();
$("loginCard").value=card;
},1200);

}catch(error){
console.error(error);
show(error.message||"Registration failed.");
}finally{
$("createBtn").disabled=false;
$("createBtn").textContent="CREATE ACCOUNT";
}
};

$("loginBtn").onclick=async function(){
const card=$("loginCard").value.trim();
const password=$("loginPassword").value;

if(!/^\d{3}$/.test(card)){
show("Enter your 3-digit account/card number.");
return;
}
if(!password){
show("Enter your password.");
return;
}

$("loginBtn").disabled=true;
$("loginBtn").textContent="LOGGING IN...";

try{
const {data:email,error:emailError}=await db.rpc("get_customer_email",{p_account_number:card});
if(emailError) throw emailError;
if(!email) throw new Error("Account number not found.");

const {data,error}=await db.auth.signInWithPassword({email:email,password:password});
if(error) throw error;
if(!data.user) throw new Error("Login failed.");

show("Login successful. Welcome to AGADA!",true);
}catch(error){
console.error(error);
show(error.message||"Login failed.");
}finally{
$("loginBtn").disabled=false;
$("loginBtn").textContent="LOGIN";
}
};

$("forgotBtn").onclick=async function(){
const card=$("loginCard").value.trim();

if(!/^\d{3}$/.test(card)){
show("Enter your 3-digit account/card number first.");
return;
}

try{
const {data:email,error:emailError}=await db.rpc("get_customer_email",{p_account_number:card});
if(emailError) throw emailError;
if(!email) throw new Error("Account number not found.");

const {error}=await db.auth.resetPasswordForEmail(email,{
redirectTo:window.location.origin+window.location.pathname
});
if(error) throw error;

show("Password reset instructions have been sent to your email.",true);
}catch(error){
console.error(error);
show(error.message||"Password reset failed.");
}
};

generateCard();
</script>
</body>
</html>
